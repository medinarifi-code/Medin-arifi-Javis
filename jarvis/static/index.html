<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- ============ Sperrbildschirm ============ -->
  <section id="lock" class="lock">
    <form id="lock-form" class="lock-card" autocomplete="off">
      <div class="orb lg" aria-hidden="true"></div>
      <h1>JARVIS</h1>
      <p id="lock-msg" class="muted">JARVIS startet …</p>
      <div id="lock-fields" hidden>
        <input id="lock-pw" type="password" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">
        <button type="submit" class="btn primary wide">Entsperren</button>
      </div>
      <p id="lock-error" class="error" hidden>Falsches Passwort</p>
    </form>
  </section>

  <!-- ============ App ============ -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="orb sm" aria-hidden="true"></div>
        <div class="brand-txt"><b>JARVIS</b><span id="state">Bereit</span></div>
      </div>
      <div class="seg" role="tablist" aria-label="Modus">
        <button role="tab" data-view="write" aria-selected="true">Chat</button>
        <button role="tab" data-view="speak" aria-selected="false">Sprechen</button>
      </div>
      <div class="tools">
        <button id="btn-voice" class="ib only-write" aria-pressed="false" title="Antworten vorlesen" aria-label="Antworten vorlesen">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button class="ib" data-open="files" title="Dateien" aria-label="Dateien">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button class="ib" data-open="mail" title="E-Mail" aria-label="E-Mail">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><i id="mail-dot" class="dot"></i>
        </button>
        <button class="ib" data-action="new" title="Neues Gespräch" aria-label="Neues Gespräch">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="ib" data-action="lock" id="btn-lock" title="Sperren" aria-label="Sperren">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
      </div>
    </header>

    <!-- Chat -->
    <section id="view-write" class="view write">
      <main id="log" class="log" aria-live="polite">
        <div id="welcome" class="welcome">
          <div class="orb lg" aria-hidden="true"></div>
          <h2 id="hello">Wie kann ich helfen?</h2>
          <div class="cards">
            <button class="sug" data-q="Habe ich neue E-Mails?"><b>📬 Neue Mails</b><span>Posteingang prüfen</span></button>
            <button class="sug" data-q="Erstelle mir eine Präsentation über "><b>📊 Präsentation</b><span>zu einem Thema erstellen</span></button>
            <button class="sug" data-q="Male mir ein Bild von "><b>🎨 Bild malen</b><span>mit KI</span></button>
            <button class="sug" data-attach="1"><b>📷 Foto senden</b><span>JARVIS schaut es an</span></button>
          </div>
        </div>
      </main>
      <footer class="bar">
        <div id="interim" class="interim"></div>
        <div id="strip" class="strip" hidden></div>
        <form id="composer" class="composer" autocomplete="off">
          <button type="button" id="attach" class="cb" aria-label="Datei oder Foto anhängen" title="Anhängen">
            <svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>
          </button>
          <input type="file" id="file" multiple hidden
            accept="image/*,.pdf,.docx,.xlsx,.pptx,.txt,.csv,.md,.json,.html,.xml,.py,.js,.css,.ics,.vcf">
          <textarea id="input" rows="1" placeholder="Nachricht an JARVIS" aria-label="Nachricht"></textarea>
          <button type="button" id="mic" class="cb" aria-label="Diktieren" title="Diktieren">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button type="submit" id="send" class="send" aria-label="Senden">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <p class="hint">JARVIS kann Fehler machen. Wichtiges bitte prüfen.</p>
      </footer>
    </section>

    <!-- Sprechen -->
    <section id="view-speak" class="view speak" hidden>
      <button id="sp-orb" class="sp-orb" aria-label="Sprechen starten oder stoppen"><canvas aria-hidden="true"></canvas></button>
      <div id="sp-state" class="sp-state">Tippe auf den Kreis und sprich</div>
      <div class="sp-talk" aria-live="polite">
        <p id="sp-user" class="sp-user"></p>
        <p id="sp-answer" class="sp-answer"></p>
        <div id="sp-extra" class="sp-extra"></div>
      </div>
      <div class="sp-controls">
        <label class="switch"><input type="checkbox" id="sp-auto" checked><span>Weiter zuhören</span></label>
        <button id="sp-test" class="btn">🔊 Stimme testen</button>
        <button id="sp-stop" class="btn">Stopp</button>
      </div>
    </section>
  </div>

  <!-- Dialoge -->
  <dialog id="mail-dialog" class="sheet">
    <div class="sheet-head"><h3>E-Mail</h3><button class="ib" id="mail-close" aria-label="Schließen">✕</button></div>
    <div id="mail-body"></div>
  </dialog>
  <dialog id="files-dialog" class="sheet">
    <div class="sheet-head"><h3>Dateien</h3><button class="ib" id="files-close" aria-label="Schließen">✕</button></div>
    <ul id="files-list" class="files"></ul>
    <div class="row end"><button id="files-clear" class="btn danger" hidden>Alle löschen</button></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
