<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Anmeldung -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="orb big" aria-hidden="true"></div>
      <h1>JARVIS</h1>
      <p>Bitte Passwort eingeben</p>
      <input id="login-pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
      <button type="submit" class="primary">Anmelden</button>
      <p id="login-error" class="error" hidden>Falsches Passwort</p>
    </form>
  </section>

  <!-- Hauptansicht -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="orb" aria-hidden="true"></div>
        <div>
          <div class="name">JARVIS</div>
          <div id="state" class="state">Bereit</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-voice" class="icon" aria-pressed="true" title="Stimme an/aus" aria-label="Stimme an/aus">🔊</button>
        <button id="btn-conv" class="icon" aria-pressed="false" title="Gesprächsmodus: hört nach jeder Antwort wieder zu" aria-label="Gesprächsmodus">🔁</button>
        <button id="btn-mail" class="icon" title="E-Mail" aria-label="E-Mail">✉️<span id="mail-dot" class="dot"></span></button>
        <button id="btn-new" class="icon" title="Neues Gespräch" aria-label="Neues Gespräch">＋</button>
      </div>
    </header>

    <main id="log" class="log" aria-live="polite">
      <div id="welcome" class="welcome">
        <div class="orb big" aria-hidden="true"></div>
        <h2 id="hello">Wie kann ich helfen?</h2>
        <div class="chips">
          <button class="chip" data-q="Habe ich neue E-Mails?">📬 Neue Mails</button>
          <button class="chip" data-q="Erstelle mir eine Präsentation über ">📊 Präsentation</button>
          <button class="chip" data-q="Was sind die wichtigsten Nachrichten heute?">📰 Nachrichten</button>
          <button class="chip" data-q="Wie wird das Wetter heute?">🌤️ Wetter</button>
        </div>
      </div>
    </main>

    <footer class="bar">
      <div id="interim" class="interim"></div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Frag JARVIS …" aria-label="Nachricht"></textarea>
        <button type="submit" id="send" class="send" aria-label="Senden">➤</button>
      </form>
      <button id="mic" class="mic" aria-label="Sprechen">🎙️</button>
    </footer>
  </div>

  <!-- E-Mail-Dialog -->
  <dialog id="mail-dialog" class="sheet">
    <div class="sheet-head">
      <h3>E-Mail</h3>
      <button class="icon" id="mail-close" aria-label="Schließen">✕</button>
    </div>
    <div id="mail-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
