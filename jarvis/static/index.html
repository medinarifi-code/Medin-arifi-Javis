<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Anmeldung -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="orb big" aria-hidden="true"></div>
      <h1>JARVIS</h1>
      <p>Bitte Passwort eingeben</p>
      <input id="login-pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
      <button type="submit" class="primary">Anmelden</button>
      <p id="login-error" class="error" hidden>Falsches Passwort</p>
    </form>
  </section>

  <!-- Hauptansicht -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="orb" aria-hidden="true"></div>
        <div>
          <div class="name">JARVIS</div>
          <div id="state" class="state">Bereit</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-voice" class="icon only-write" aria-pressed="false" title="Antworten vorlesen" aria-label="Antworten vorlesen">🔊</button>
        <button id="btn-mail" class="icon" title="E-Mail" aria-label="E-Mail">✉️<span id="mail-dot" class="dot"></span></button>
        <button id="btn-new" class="icon" title="Neues Gespräch" aria-label="Neues Gespräch">＋</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Modus">
      <button id="tab-write" class="tab" role="tab" aria-selected="true">💬 Schreiben</button>
      <button id="tab-speak" class="tab" role="tab" aria-selected="false">🎙️ Sprechen</button>
    </nav>

    <!-- Bereich: Schreiben -->
    <section id="view-write" class="view">
    <main id="log" class="log" aria-live="polite">
      <div id="welcome" class="welcome">
        <div class="orb big" aria-hidden="true"></div>
        <h2 id="hello">Wie kann ich helfen?</h2>
        <div class="chips">
          <button class="chip" data-q="Habe ich neue E-Mails?">📬 Neue Mails</button>
          <button class="chip" data-q="Erstelle mir eine Präsentation über ">📊 Präsentation</button>
          <button class="chip" data-q="Was sind die wichtigsten Nachrichten heute?">📰 Nachrichten</button>
          <button class="chip" data-q="Wie wird das Wetter heute?">🌤️ Wetter</button>
          <button class="chip" data-q="Male mir ein Bild von ">🎨 Bild malen</button>
          <button class="chip" data-attach="1">📷 Foto/Datei schicken</button>
        </div>
      </div>
    </main>

    <footer class="bar">
      <div id="interim" class="interim"></div>
      <div id="strip" class="strip" hidden></div>
      <form id="composer" class="composer" autocomplete="off">
        <button type="button" id="attach" class="attach" aria-label="Datei oder Foto anhängen" title="Bild oder Datei anhängen">📎</button>
        <input type="file" id="file" multiple hidden
          accept="image/*,.pdf,.docx,.xlsx,.pptx,.txt,.csv,.md,.json,.html,.xml,.py,.js,.css,.ics,.vcf">
        <textarea id="input" rows="1" placeholder="Frag JARVIS …" aria-label="Nachricht"></textarea>
        <button type="submit" id="send" class="send" aria-label="Senden">➤</button>
      </form>
      <button id="mic" class="mic" aria-label="Diktieren" title="Diktieren: gesprochener Text landet im Eingabefeld">🎙️</button>
    </footer>
    </section>

    <!-- Bereich: Sprechen -->
    <section id="view-speak" class="view speak" hidden>
      <div class="sp-stage">
        <button id="sp-orb" class="orb huge" aria-label="Sprechen starten oder stoppen"></button>
        <div id="sp-state" class="sp-state">Tippe auf die Kugel und sprich</div>
        <div id="sp-status" class="sp-status"></div>
      </div>
      <div class="sp-talk" aria-live="polite">
        <p id="sp-user" class="sp-user"></p>
        <p id="sp-answer" class="sp-answer"></p>
        <div id="sp-extra" class="sp-extra"></div>
      </div>
      <div class="sp-controls">
        <label class="switch"><input type="checkbox" id="sp-auto" checked> <span>Nach jeder Antwort weiter zuhören</span></label>
        <button id="sp-stop" class="secondary">⏹ Stopp</button>
      </div>
    </section>
  </div>

  <!-- E-Mail-Dialog -->
  <dialog id="mail-dialog" class="sheet">
    <div class="sheet-head">
      <h3>E-Mail</h3>
      <button class="icon" id="mail-close" aria-label="Schließen">✕</button>
    </div>
    <div id="mail-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
