# Render-Blueprint: JARVIS als Webseite online stellen (kostenloser Tarif).
# Anleitung: README.md -> "Online stellen"
services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    branch: claude/epic-carson-rk8vdn
    buildCommand: pip install -r requirements-web.txt
    startCommand: python -m jarvis.web --cloud
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JARVIS_OUTPUT_DIR
        value: /tmp/jarvis
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: JARVIS_WEB_PASSWORD
        sync: false
      - key: JARVIS_USER_NAME
        sync: false
