# Render-Blueprint: JARVIS online stellen (kostenlos). Anleitung: README.md
services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    branch: claude/epic-carson-rk8vdn
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jarvis --cloud
    healthCheckPath: /api/info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JARVIS_OUTPUT_DIR
        value: /tmp/jarvis
      # Pflicht: kostenloser Key von https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      # Optional, kostenlos: OpenRouter-Key (openrouter.ai/keys) – springt ein, wenn Groq überlastet ist
      - key: OPENROUTER_API_KEY
        sync: false
      # Pflicht: dein Passwort für JARVIS (schützt auch deine Mails)
      - key: JARVIS_WEB_PASSWORD
        sync: false
      - key: JARVIS_USER_NAME
        sync: false
      # E-Mail, Weg A - Outlook/Hotmail: Anwendungs-ID aus Microsoft Entra (siehe README)
      - key: MS_CLIENT_ID
        sync: false
      # E-Mail, Weg B - Gmail/GMX/Web.de: Adresse + App-Passwort
      - key: MAIL_ADDRESS
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      # Optional: kostenloses Pollinations-Konto (auth.pollinations.ai) -> schnellere KI-Bilder ohne Wasserzeichen
      - key: POLLINATIONS_TOKEN
        sync: false
